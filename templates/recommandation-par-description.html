<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recommandation de Livres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center mb-4">Recommandez-moi un livre</h1>

    <!-- Formulaire de recherche -->
    <form method="post" action="/api/recommandation-par-description">
        <div class="mb-3">
            <label for="description" class="form-label">Décrivez le livre que vous cherchez…</label>
            <textarea class="form-control" id="description" name="description" rows="3" required>{{ description or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Obtenir des suggestions</button>
    </form>

    <!-- Affichage des suggestions -->
    {% if suggestions %}
    <h3 class="mt-4">Suggestions :</h3>
    <div class="row">
        {% for livre in suggestions %}
        <div class="col-md-3 mb-3">
            <div class="card h-100 shadow-sm">
                {% if livre.Image_URL %}
                <img src="{{ livre.Image_URL }}" class="card-img-top" alt="{{ livre.title }}" loading="lazy">
                {% else %}
                <img src="https://via.placeholder.com/150x200?text=Livre" class="card-img-top" alt="Couverture">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ livre.title }}</h5>
                    <p class="card-text">{{ livre.Description[:100] }}...</p>
                    <a href="/livre/{{ livre.id }}" class="btn btn-outline-primary btn-sm">Voir détails</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
</body>
</html>
