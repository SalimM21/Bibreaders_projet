<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des emprunts (Autonome)</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e9ecef;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background-color: white;
            padding: 20px;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
        }

        /* Styles pour les messages de feedback */
        .alert-success, .alert-danger {
            display: none; /* Masqué par défaut */
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h1 class="mb-4">📚 Gestion des emprunts</h1>

        <!-- Formulaire nouvel emprunt -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                📗 Enregistrer un nouvel emprunt
            </div>
            <div class="card-body">
                <form id="form-nouvel-emprunt" method="POST">
                    <div class="mb-3">
                        <label for="adherent" class="form-label">Sélectionner l'adhérent</label>
                        <select id="adherent" name="adherent_id" class="form-select" required>
                            <!-- Options remplies dynamiquement via JS -->
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="livre" class="form-label">Sélectionner le livre</label>
                        <select id="livre" name="livre_id" class="form-select" required>
                            <!-- Options remplies dynamiquement via JS -->
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Enregistrer l'emprunt</button>
                    <div id="empruntMessage" class="alert mt-3" role="alert"></div>
                </form>
            </div>
        </div>

        <!-- Formulaire retour -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                🔄 Enregistrer un retour
            </div>
            <div class="card-body">
                <form id="form-retour-emprunt" method="POST">
                    <div class="mb-3">
                        <label for="emprunt" class="form-label">Sélectionner le prêt en cours</label>
                        <select id="emprunt" name="emprunt_id" class="form-select" required>
                            <!-- Options remplies dynamiquement via JS -->
                        </select>
                    </div>

                    <button type="submit" class="btn btn-warning w-100">Enregistrer le retour</button>
                    <div id="retourMessage" class="alert mt-3" role="alert"></div>
                </form>
            </div>
        </div>
        
        <!-- Section consulter un livre -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                🔎 Consulter un livre par ID
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="number" id="livre-id-input" class="form-control" placeholder="ID du livre" min="1" required>
                    <button class="btn btn-info text-white" type="button" id="consulter-btn">Consulter</button>
                </div>
                <div id="livre-details" class="mt-3">
                    <!-- Les détails du livre seront affichés ici -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Simulation des données de la base de données
        const database = {
            adherents: [
                { id: 1, nom: "Alice Dubois" },
                { id: 2, nom: "Bob Martin" },
                { id: 3, nom: "Claire Bernard" },
                { id: 4, nom: "Salim Majid" },
                { id: 5, nom: "Ikram Naoui" },
                { id: 6, nom: "Btissam Sannaky" }
            ],
            livres: [
                { id: 1, title: "Le Seigneur des Anneaux", description: "Un roman de fantasy épique.", availability_num: 1 },
                { id: 2, title: "Harry Potter à l'école des sorciers", description: "Le premier tome de la saga magique.", availability_num: 2 },
                { id: 3, title: "Dune", description: "Un roman de science-fiction.", availability_num: 0 },
                { id: 4, title: "1984", description: "Un classique de la dystopie.", availability_num: 1 },
                { id: 5, title: "Le Petit Prince", description: "Un conte philosophique.", availability_num: 3 },
                { id: 6, title: "somission", description: "Un roman historique.", availability_num: 1 },
                { id: 7, title: "Le Comte de Monte-Cristo", description: "Un roman d'aventure.", availability_num: 0 }
            ],
            emprunts: [
                { id: 1, id_adherent: 1, id_livre: 3, date_emprunt: new Date("2025-08-20"), date_retour_effectif: null },
                { id: 2, id_adherent: 2, id_livre: 7, date_emprunt: new Date("2025-08-20"), date_retour_effectif: null },
                { id: 3, id_adherent: 3, id_livre: 1, date_emprunt: new Date("2025-08-20"), date_retour_effectif: new Date("2025-08-28") }
            ],
            nextEmpruntId: 4,
            nextLivreId: 8
        };

        function showMessage(elementId, message, isSuccess) {
            const messageBox = document.getElementById(elementId);
            messageBox.textContent = message;
            messageBox.style.display = "block";
            if (isSuccess) {
                messageBox.className = "alert mt-3 alert-success";
            } else {
                messageBox.className = "alert mt-3 alert-danger";
            }
        }

        // Simule les appels d'API et met à jour l'interface
        function fetchAndPopulate() {
            // Remplir les adhérents
            const adherentSelect = document.getElementById("adherent");
            adherentSelect.innerHTML = '';
            database.adherents.forEach(a => {
                const option = document.createElement("option");
                option.value = a.id;
                option.textContent = a.nom;
                adherentSelect.appendChild(option);
            });

            // Remplir les livres disponibles
            const livreSelect = document.getElementById("livre");
            livreSelect.innerHTML = '';
            const livresDisponibles = database.livres.filter(l => l.availability_num > 0);
            livresDisponibles.forEach(l => {
                const option = document.createElement("option");
                option.value = l.id;
                option.textContent = `${l.title} (Dispo: ${l.availability_num})`;
                livreSelect.appendChild(option);
            });

            // Remplir les emprunts en cours
            const empruntSelect = document.getElementById("emprunt");
            empruntSelect.innerHTML = '';
            const empruntsEnCours = database.emprunts.filter(e => e.date_retour_effectif === null);
            empruntsEnCours.forEach(e => {
                const livre = database.livres.find(l => l.id === e.id_livre);
                const adherent = database.adherents.find(a => a.id === e.id_adherent);
                const option = document.createElement("option");
                option.value = e.id;
                option.textContent = `${livre.title} (Emprunté par ${adherent.nom})`;
                empruntSelect.appendChild(option);
            });
        }

        // Gestion de l'enregistrement de l'emprunt
        document.getElementById("form-nouvel-emprunt").addEventListener("submit", (e) => {
            e.preventDefault();
            const adherentId = parseInt(document.getElementById("adherent").value);
            const livreId = parseInt(document.getElementById("livre").value);

            const livre = database.livres.find(l => l.id === livreId);
            if (!livre || livre.availability_num <= 0) {
                showMessage("empruntMessage", "Livre indisponible.", false);
                return;
            }

            const nouvelEmprunt = {
                id: database.nextEmpruntId++,
                id_adherent: adherentId,
                id_livre: livreId,
                date_emprunt: new Date(),
                date_retour_effectif: null
            };
            database.emprunts.push(nouvelEmprunt);
            livre.availability_num--;

            showMessage("empruntMessage", "Emprunt enregistré avec succès.", true);
            e.target.reset();
            fetchAndPopulate();
        });

        // Gestion de l'enregistrement du retour
        document.getElementById("form-retour-emprunt").addEventListener("submit", (e) => {
            e.preventDefault();
            const empruntId = parseInt(document.getElementById("emprunt").value);

            const emprunt = database.emprunts.find(e => e.id === empruntId);
            if (!emprunt) {
                showMessage("retourMessage", "Emprunt introuvable.", false);
                return;
            }

            if (emprunt.date_retour_effectif !== null) {
                showMessage("retourMessage", "Cet emprunt a déjà été retourné.", false);
                return;
            }

            emprunt.date_retour_effectif = new Date();
            const livre = database.livres.find(l => l.id === emprunt.id_livre);
            if (livre) {
                livre.availability_num++;
            }

            showMessage("retourMessage", "Retour enregistré avec succès.", true);
            e.target.reset();
            fetchAndPopulate();
        });

        // Gestion de la consultation d'un livre
        document.getElementById("consulter-btn").addEventListener("click", () => {
            const livreId = parseInt(document.getElementById("livre-id-input").value);
            const livreDetailsDiv = document.getElementById("livre-details");
            livreDetailsDiv.innerHTML = '';

            const livre = database.livres.find(l => l.id === livreId);
            if (!livre) {
                livreDetailsDiv.innerHTML = '<div class="alert alert-danger">Livre non trouvé.</div>';
                return;
            }

            livreDetailsDiv.innerHTML = `
                <h5>Détails du livre (ID: ${livre.id})</h5>
                <p><strong>Titre:</strong> ${livre.title}</p>
                <p><strong>Description:</strong> ${livre.description}</p>
                <p><strong>Disponibilité:</strong> ${livre.availability_num} exemplaire(s)</p>
            `;
        });

        // Chargement initial des données
        fetchAndPopulate();
    </script>
</body>

</html>
