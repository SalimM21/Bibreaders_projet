<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau des Livres</title>
    <!-- Inclure Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        <h1 class="text-3xl font-bold mb-6 text-gray-800 text-center">Liste des Livres</h1>
        
        <!-- Nouveau bouton pour ajouter un livre -->
        <div class="flex justify-end mb-4">
            <button id="add-book-btn" class="py-2 px-4 rounded-lg bg-green-600 text-white font-semibold transition duration-150 ease-in-out hover:bg-green-700">Ajouter un livre</button>
        </div>

        <!-- Conteneur du tableau -->
        <div class="overflow-x-auto">
            <table id="book-table" class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Auteur</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <!-- Données de livres statiques pour l'exemple -->
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Le Petit Prince</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Antoine de Saint-Exupéry</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="edit-btn text-indigo-600 hover:text-indigo-900 mr-2 py-2 px-3 rounded-lg bg-indigo-100 font-semibold transition duration-150 ease-in-out hover:bg-indigo-200">Modifier</button>
                            <button class="delete-btn text-red-600 hover:text-red-900 py-2 px-3 rounded-lg bg-red-100 font-semibold transition duration-150 ease-in-out hover:bg-red-200">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">1984</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">George Orwell</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="edit-btn text-indigo-600 hover:text-indigo-900 mr-2 py-2 px-3 rounded-lg bg-indigo-100 font-semibold transition duration-150 ease-in-out hover:bg-indigo-200">Modifier</button>
                            <button class="delete-btn text-red-600 hover:text-red-900 py-2 px-3 rounded-lg bg-red-100 font-semibold transition duration-150 ease-in-out hover:bg-red-200">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Le Parfum</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Patrick Süskind</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="edit-btn text-indigo-600 hover:text-indigo-900 mr-2 py-2 px-3 rounded-lg bg-indigo-100 font-semibold transition duration-150 ease-in-out hover:bg-indigo-200">Modifier</button>
                            <button class="delete-btn text-red-600 hover:text-red-900 py-2 px-3 rounded-lg bg-red-100 font-semibold transition duration-150 ease-in-out hover:bg-red-200">Supprimer</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modale pour ajouter un livre -->
    <div id="add-modal" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden">
        <div class="bg-white rounded-xl p-8 shadow-2xl max-w-md w-full mx-4">
            <h2 class="text-xl font-bold mb-4">Ajouter un nouveau livre</h2>
            <form id="add-form">
                <div class="mb-4">
                    <label for="add-title" class="block text-sm font-medium text-gray-700">Titre</label>
                    <input type="text" id="add-title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2" required>
                </div>
                <div class="mb-6">
                    <label for="add-author" class="block text-sm font-medium text-gray-700">Auteur</label>
                    <input type="text" id="add-author" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2" required>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-add-btn" class="py-2 px-4 rounded-lg bg-gray-200 text-gray-800 font-semibold hover:bg-gray-300">Annuler</button>
                    <button type="submit" class="py-2 px-4 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale de suppression personnalisée -->
    <div id="delete-modal" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden">
        <div class="bg-white rounded-xl p-8 shadow-2xl max-w-sm w-full mx-4">
            <h2 class="text-xl font-bold mb-4">Confirmation de suppression</h2>
            <p id="delete-message" class="mb-6 text-gray-600">Êtes-vous sûr de vouloir supprimer ce livre ?</p>
            <div class="flex justify-end space-x-4">
                <button id="cancel-delete-btn" class="py-2 px-4 rounded-lg bg-gray-200 text-gray-800 font-semibold hover:bg-gray-300">Annuler</button>
                <button id="confirm-delete-btn" class="py-2 px-4 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700">Supprimer</button>
            </div>
        </div>
    </div>

    <!-- Modale de modification personnalisée -->
    <div id="edit-modal" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden">
        <div class="bg-white rounded-xl p-8 shadow-2xl max-w-md w-full mx-4">
            <h2 class="text-xl font-bold mb-4">Modifier le livre</h2>
            <form id="edit-form">
                <div class="mb-4">
                    <label for="edit-title" class="block text-sm font-medium text-gray-700">Titre</label>
                    <input type="text" id="edit-title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2" required>
                </div>
                <div class="mb-6">
                    <label for="edit-author" class="block text-sm font-medium text-gray-700">Auteur</label>
                    <input type="text" id="edit-author" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2" required>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-edit-btn" class="py-2 px-4 rounded-lg bg-gray-200 text-gray-800 font-semibold hover:bg-gray-300">Annuler</button>
                    <button type="submit" class="py-2 px-4 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Sauvegarder</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Zone de message pour les notifications -->
    <div id="message-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.querySelector('#book-table tbody');
            const messageContainer = document.getElementById('message-container');
            
            // Éléments pour la modale d'ajout
            const addBookBtn = document.getElementById('add-book-btn');
            const addModal = document.getElementById('add-modal');
            const addForm = document.getElementById('add-form');
            const cancelAddBtn = document.getElementById('cancel-add-btn');
            const addTitleInput = document.getElementById('add-title');
            const addAuthorInput = document.getElementById('add-author');

            // Éléments pour la modale de suppression
            const deleteModal = document.getElementById('delete-modal');
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            let rowToDelete = null;

            // Éléments pour la modale de modification
            const editModal = document.getElementById('edit-modal');
            const editForm = document.getElementById('edit-form');
            const cancelEditBtn = document.getElementById('cancel-edit-btn');
            const editTitleInput = document.getElementById('edit-title');
            const editAuthorInput = document.getElementById('edit-author');
            let rowToEdit = null;

            // Fonction pour afficher un message
            function showMessage(text) {
                const messageBox = document.createElement('div');
                messageBox.className = 'message-box border border-gray-300';
                messageBox.innerHTML = `
                    <p class="text-gray-700">${text}</p>
                `;
                messageContainer.appendChild(messageBox);

                // Disparition du message après 3 secondes
                setTimeout(() => {
                    messageBox.remove();
                }, 3000);
            }

            // Crée une nouvelle ligne de tableau pour un livre
            function createBookRow(title, author) {
                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${title}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${author}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button class="edit-btn text-indigo-600 hover:text-indigo-900 mr-2 py-2 px-3 rounded-lg bg-indigo-100 font-semibold transition duration-150 ease-in-out hover:bg-indigo-200">Modifier</button>
                        <button class="delete-btn text-red-600 hover:text-red-900 py-2 px-3 rounded-lg bg-red-100 font-semibold transition duration-150 ease-in-out hover:bg-red-200">Supprimer</button>
                    </td>
                `;
                return newRow;
            }

            // Écouteur d'événements pour les clics sur les boutons "Modifier" et "Supprimer"
            tableBody.addEventListener('click', (event) => {
                const button = event.target;
                const row = button.closest('tr');
                const titleCell = row.querySelector('td:first-child');
                const authorCell = row.querySelector('td:nth-child(2)');

                if (button.classList.contains('delete-btn')) {
                    rowToDelete = row;
                    document.getElementById('delete-message').textContent = `Êtes-vous sûr de vouloir supprimer "${titleCell.textContent}" de la liste ?`;
                    deleteModal.classList.remove('hidden');
                } else if (button.classList.contains('edit-btn')) {
                    rowToEdit = row;
                    editTitleInput.value = titleCell.textContent;
                    editAuthorInput.value = authorCell.textContent;
                    editModal.classList.remove('hidden');
                }
            });

            // Gérer la confirmation de suppression
            confirmDeleteBtn.addEventListener('click', () => {
                if (rowToDelete) {
                    const title = rowToDelete.querySelector('td:first-child').textContent;
                    rowToDelete.remove();
                    showMessage(`Le livre "${title}" a été supprimé.`);
                    rowToDelete = null;
                    deleteModal.classList.add('hidden');
                }
            });

            // Gérer l'annulation de la suppression
            cancelDeleteBtn.addEventListener('click', () => {
                deleteModal.classList.add('hidden');
            });

            // Gérer la soumission du formulaire de modification
            editForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (rowToEdit) {
                    const titleCell = rowToEdit.querySelector('td:first-child');
                    const authorCell = rowToEdit.querySelector('td:nth-child(2)');
                    
                    const newTitle = editTitleInput.value.trim();
                    const newAuthor = editAuthorInput.value.trim();

                    if (newTitle !== '') {
                        titleCell.textContent = newTitle;
                    }
                    if (newAuthor !== '') {
                        authorCell.textContent = newAuthor;
                    }
                    showMessage(`Le livre "${newTitle}" a été mis à jour.`);
                    rowToEdit = null;
                    editModal.classList.add('hidden');
                }
            });

            // Gérer l'annulation de la modification
            cancelEditBtn.addEventListener('click', () => {
                editModal.classList.add('hidden');
            });

            // Gérer l'ouverture de la modale d'ajout
            addBookBtn.addEventListener('click', () => {
                addTitleInput.value = '';
                addAuthorInput.value = '';
                addModal.classList.remove('hidden');
            });

            // Gérer l'annulation de l'ajout
            cancelAddBtn.addEventListener('click', () => {
                addModal.classList.add('hidden');
            });

            // Gérer la soumission du formulaire d'ajout
            addForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const title = addTitleInput.value.trim();
                const author = addAuthorInput.value.trim();

                if (title && author) {
                    const newRow = createBookRow(title, author);
                    tableBody.appendChild(newRow);
                    showMessage(`Le livre "${title}" a été ajouté.`);
                    addModal.classList.add('hidden');
                } else {
                    showMessage("Veuillez remplir tous les champs.");
                }
            });
        });
    </script>
</body>
</html>
