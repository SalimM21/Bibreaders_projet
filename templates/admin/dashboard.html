<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/admin/dashboard">📚 Admin Librairie</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/admin/gestion-livres">Gestion Livres</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/gestion-adherents">Gestion Adhérents</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/emprunts">Gestion Emprunts</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/statistiques">Statistiques</a></li>
          <li class="nav-item">
            <form action="/logout" method="post">
              <button type="submit" class="btn btn-danger btn-sm">Se déconnecter</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenu -->
  <div class="container mt-4">
    <h1 class="mb-4 text-center">📊 Tableau de Bord Admin</h1>

    <div class="row">
      <!-- Graphique Top Livres -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Top 5 Livres les plus empruntés</div>
          <div class="card-body">
            <canvas id="chartTopLivres"></canvas>
          </div>
        </div>
      </div>

      <!-- Graphique Disponibilité -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white">Disponibilité du Stock</div>
          <div class="card-body">
            <canvas id="chartDisponibilite"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script Chart.js -->
  <script>
    // ✅ Récupération des données JSON envoyées par FastAPI/Jinja2
    const topLivres = JSON.parse('{{ top_livres | tojson | safe }}');
    const tauxDisponibilite = JSON.parse('{{ taux_disponibilite | tojson | safe }}');

    // Graphique Top Livres
    const ctx1 = document.getElementById('chartTopLivres').getContext('2d');
    new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: topLivres.map(l => l.title),
        datasets: [{
          label: "Nombre d'emprunts",
          data: topLivres.map(l => l.count),
          backgroundColor: "rgba(26, 188, 156, 0.6)"
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } }
      }
    });

    // Graphique Disponibilité
    const ctx2 = document.getElementById('chartDisponibilite').getContext('2d');
    new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: ["Disponibles", "Indisponibles"],
        datasets: [{
          data: [tauxDisponibilite, 100 - tauxDisponibilite],
          backgroundColor: ["#1abc9c", "#e74c3c"]
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } }
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
